{% extends "base.html" %}

{% block title %}Botanica | Shop{% endblock %}

{% block content %}
<section class="hero">
    <h1>Discover Herbs Naturally</h1>
    <p>Search by common name, scientific name, or filter by benefits.</p>
</section>

<section class="shop-layout">
    <aside class="sidebar">
        <h3>Filter by Benefits</h3>

        <div class="benefit-list">
            <label><input type="checkbox" class="benefit-filter" value="Digestion"> Digestion</label>
            <label><input type="checkbox" class="benefit-filter" value="Immunity"> Immunity</label>
            <label><input type="checkbox" class="benefit-filter" value="Sleep"> Sleep</label>
            <label><input type="checkbox" class="benefit-filter" value="Stress Relief"> Stress Relief</label>
            <label><input type="checkbox" class="benefit-filter" value="Skin Health"> Skin Health</label>
        </div>

        <div class="filter-controls">
            <button id="clearFilters" class="btn btn-secondary">Clear All</button>
            <p>Active filters: <span id="filterCount">0</span></p>
        </div>
    </aside>

    <section class="content-area">
        <div class="search-bar-group">
            <input type="text" id="commonSearch" placeholder="Search by common name">
            <input type="text" id="scientificSearch" placeholder="Search by scientific name">
        </div>

        <div id="productGrid" class="card-grid"></div>
        <p id="noResults" class="no-results hidden">No results found.</p>
    </section>
</section>
{% endblock %}
