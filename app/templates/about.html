<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Botanica - Herbal Marketplace</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8f4;
    }

    header {
      background: #2e7d32;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
    }

    nav {
      background: #388e3c;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: inline-block;
      width: 250px;
      vertical-align: top;
    }

    .card h3 {
      margin: 0;
      color: #2e7d32;
    }

    .btn {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 8px 12px;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 5px;
    }

    .btn:hover {
      background: #1b5e20;
    }

    .form-box {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
      max-width: 400px;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
    }
  </style>
</head>
<body>

<header>🌿 Botanica Marketplace</header>

<nav>
  <a href="#">Home</a>
  <a href="#">Buy Herbs</a>
  <a href="#">Sell Herbs</a>
  <a href="#">Post Requirement</a>
</nav>

<div class="container">

  <h2>Available Herbs</h2>

  <div class="card">
    <h3>Turmeric</h3>
    <p>Price: Rs. 300/kg</p>
    <p>Seller: Ram Herbs</p>
    <button class="btn">Buy</button>
  </div>

  <div class="card">
    <h3>Neem Leaves</h3>
    <p>Price: Rs. 200/kg</p>
    <p>Seller: Herbal Nepal</p>
    <button class="btn">Buy</button>
  </div>

  <div class="card">
    <h3>Ashwagandha</h3>
    <p>Price: Rs. 500/kg</p>
    <p>Seller: Ayurveda Store</p>
    <button class="btn">Buy</button>
  </div>

  <h2>Post Your Requirement</h2>

  <div class="form-box">
    <input type="text" id="herb" placeholder="Herb Name">
    <input type="number" id="quantity" placeholder="Quantity (kg)">
    <textarea id="details" placeholder="Additional Details"></textarea>
    <button class="btn" onclick="postRequirement()">Post</button>
  </div>

</div>

<script>
  function postRequirement() {
    let herb = document.getElementById("herb").value;
    let qty = document.getElementById("quantity").value;

    if (herb && qty) {
      alert("Requirement Posted for " + herb + " (" + qty + "kg)");
    } else {
      alert("Please fill all fields");
    }
  }
</script>

</body>
</html>
